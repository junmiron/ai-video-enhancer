[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aive"
version = "0.1.0"
description = "AI Video Enhancer - AI upscale, frame interpolation, artifact detection & repair"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "opencv-python",
    "torch",
    "onnx",
    "tensorrt",
    "scenedetect[opencv]",
    # GUI
    "PySide6",
    # sample-clip generator (tools/make_sample_clip.py)
    "pillow",
    # model architectures (depth / SCUNet repair)
    "einops",
    "timm",
    "safetensors",
]

[project.optional-dependencies]
dev = ["pytest"]
# Optional speed-ups: xformers accelerates the depth models; onnxruntime is only
# needed to re-export LIMBO ONNX->TRT (tools/depth export helper).
speed = ["xformers", "onnxruntime"]

[tool.setuptools.packages.find]
include = ["aive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: tests that require CUDA + cached model weights (RIFE inference / TRT engine build)",
]
